services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-dojo-postgres
    environment:
      POSTGRES_USER: kim
      POSTGRES_PASSWORD: kim
      POSTGRES_DB: user_service
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kim -d user_service"]
      interval: 20s
      timeout: 5s
      retries: 5
