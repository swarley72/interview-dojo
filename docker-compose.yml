services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-dojo-postgres
    environment:
      POSTGRES_USER: kim
      POSTGRES_PASSWORD: kim
      POSTGRES_DB: user_service
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kim -d user_service"]
      interval: 20s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: interview-dojo-user-service
    environment:
      DATABASE_URL: postgres://kim:kim@postgres:5432/user_service?sslmode=disable
      GRPC_PORT: 50051
      JWT_SECRET: super-secret-key-change-me
      ACCESS_TOKEN_EXP: 15m
      REFRESH_TOKEN_EXP: 720h
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: interview-dojo-api-gateway
    environment:
      USER_SERVICE_ADDR: user-service:50051
      JWT_SECRET: super-secret-key-change-me
      HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - user-service

  core-service:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    container_name: interview-dojo-core-service
    environment:
      DATABASE_URL: postgres://kim:kim@postgres:5432/core_service?sslmode=disable
      GRPC_PORT: 50052
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
